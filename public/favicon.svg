<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" /> 
      <stop offset="100%" stop-color="#6366f1" /> 
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer border -->
  <circle cx="50" cy="50" r="46" fill="#0f172a" stroke="url(#grad)" stroke-width="4" />
  
  <!-- Hexagonal background pattern -->
  <path d="M50 18 L78 34 L78 66 L50 82 L22 66 L22 34 Z" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.25" />
  
  <!-- Text RPS -->
  <text x="50" y="55" font-family="'Outfit', 'Inter', 'Arial', sans-serif" font-size="28" font-weight="900" fill="url(#grad)" text-anchor="middle" letter-spacing="1">RPS</text>
  
  <!-- Arena Subtitle -->
  <text x="50" y="70" font-family="'Outfit', 'Inter', 'Arial', sans-serif" font-size="9" font-weight="800" fill="#ffffff" opacity="0.8" text-anchor="middle" letter-spacing="3">ARENA</text>
</svg>
